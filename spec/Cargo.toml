[package]
name = "relay-spec"
description = "Wire format for relay condition blocks: the contract between target programs and crank turners"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# bytemuck is the ONLY dependency, deliberately: the condition block is
# zero-copy pod state read in place on-chain, and bytemuck is no_std, tiny,
# and already in every Solana program tree (Anchor 0.29/1.0/v2 alike).
# Nothing else may be added here.
[dependencies]
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
# anchor-lang v2, only for the CLOB's IDL build: it needs `IdlType` on the
# condition-block types the CLOB account embeds. Optional and gated, so the
# on-chain zero-copy build never compiles it.
#
# The rev is otter-sec anchor-next plus one commit, which lowers the
# solana-address bound from 2.7.0 to 2.6.1. anchor asks for a version that
# only agave 4.3 supplies, and litesvm 0.16 holds solana-address below
# 2.7.0, so the two cannot resolve together. Point this at mainline once
# that commit is upstream (otter-sec/anchor#5056).
#
# The rev is held by `pin/relax-solana-address-2d5847f4` on the fork, not by
# the pull request's own branch. A review round rewrites the pull request's
# branch, and a rev that only it referenced would stop resolving.
#
# This rev must equal the one velocity's CLOB names. Two copies of
# anchor-lang in one tree stop the `IdlType` derives from satisfying its
# IDL build.
anchor-lang-v2 = { package = "anchor-lang", git = "https://github.com/velocity-exchange/anchor.git", rev = "206fb1f06b286ff1ec68faa90fe69c5b9d72fcd9", optional = true }

[features]
default = []
# Neutral flag the fork's `IdlType` derive checks; this crate has no anchor otherwise.
idl-build = []
idl-build-v2 = ["dep:anchor-lang-v2", "idl-build"]
