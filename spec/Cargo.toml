[package]
name = "relay-spec"
description = "Wire format for relay condition blocks: the contract between target programs and crank turners"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# bytemuck is the ONLY dependency, deliberately: the condition block is
# zero-copy pod state read in place on-chain, and bytemuck is no_std, tiny,
# and already in every Solana program tree (Anchor 0.29/1.0/v2 alike).
# Nothing else may be added here.
[dependencies]
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
# anchor-lang v2, only for the CLOB's IDL build: it needs `IdlType` on the
# condition-block types the CLOB account embeds. Optional and gated, so the
# on-chain zero-copy build never compiles it.
#
# The rev tracks otter-sec anchor-next. It must lower the solana-address
# bound to 2.6.1: anchor asks for a version that only agave 4.3 supplies,
# and litesvm 0.16 holds solana-address below 2.7.0, so a tree with both
# cannot resolve one version. That bound is upstream as of this rev.
#
# This rev must equal the one velocity's CLOB names. Two copies of
# anchor-lang in one tree stop the `IdlType` derives from satisfying its
# IDL build.
anchor-lang-v2 = { package = "anchor-lang", git = "https://github.com/otter-sec/anchor.git", rev = "abacd0e9362d957e7da779fa81b1a10dd9480b28", optional = true }

[features]
default = []
# Neutral flag anchor's `IdlType` derive checks; this crate has no anchor otherwise.
idl-build = []
idl-build-v2 = ["dep:anchor-lang-v2", "idl-build"]
