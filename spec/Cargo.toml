[package]
name = "relay-spec"
description = "Wire format for relay condition blocks: the contract between target programs and crank turners"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# bytemuck is the ONLY dependency, deliberately: the condition block is
# zero-copy pod state read in place on-chain, and bytemuck is no_std, tiny,
# and already in every Solana program tree (Anchor 0.29/1.0/v2 alike).
# Nothing else may be added here.
[dependencies]
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
# The velocity anchor fork, only for the CLOB's IDL build: it needs the fork's
# `IdlType` on the condition-block types the CLOB account embeds. Optional and
# gated, so the on-chain zero-copy build never compiles it.
anchor-lang-v2 = { git = "https://github.com/velocity-exchange/anchor.git", rev = "2bc4d3c23edc2b63707301ae6d4037b9202ef0cc", optional = true }

[features]
default = []
# Neutral flag the fork's `IdlType` derive checks; this crate has no anchor otherwise.
idl-build = []
idl-build-v2 = ["dep:anchor-lang-v2", "idl-build"]
