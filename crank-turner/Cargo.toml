[package]
name = "relay-crank-turner"
description = "Generic crank turner: watches relay conditions, discovers work via simulation, submits payment-asserted cranks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
relay-spec = { path = "../spec" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bincode = "1"
clap = { version = "4", features = ["derive", "env"] }
solana-client = "3"
solana-commitment-config = "3"
solana-sdk = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
litesvm = "0.11.0"
sha2 = "0.10"
