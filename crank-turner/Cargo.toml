[package]
name = "relay-crank-turner"
description = "Generic crank turner: watches relay conditions, discovers work via simulation, submits payment-asserted cranks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
relay-spec = { path = "../spec" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bincode = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
prometheus = { version = "0.13", default-features = false }
solana-account = "3"
solana-account-decoder = "3"
solana-client = "3"
solana-commitment-config = "3"
solana-pubsub-client = "3"
solana-rpc-client-api = "3"
solana-sdk = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Same git rev as velocity's rust workspace so the two dependency trees can
# coexist in one deployment.
yellowstone-grpc-client = { git = "https://github.com/rpcpool/yellowstone-grpc", rev = "b39a415a219e842143f97440a0d0ef04207152c2" }
yellowstone-grpc-proto = { git = "https://github.com/rpcpool/yellowstone-grpc", rev = "b39a415a219e842143f97440a0d0ef04207152c2" }

[dev-dependencies]
litesvm = "0.11.0"
sha2 = "0.10"
