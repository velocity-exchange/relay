[package]
name = "relay-crank-turner"
description = "Generic crank turner: watches relay conditions, discovers work via simulation, submits payment-asserted cranks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
relay-spec = { path = "../spec" }
relay-chain-source = { path = "../chain-source" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
# The simulation engine, not just a test harness: every resolver and
# executor simulation runs in-process.
litesvm = "0.16.0"
prometheus = { version = "0.13", default-features = false }
solana-account = "4"
solana-account-decoder = "4"
solana-client = "4"
solana-message = "4"
solana-commitment-config = "3"
solana-pubsub-client = "4"
solana-rpc-client-api = "4"
solana-sdk = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Same git rev as velocity's rust workspace so the two dependency trees can
# coexist in one deployment.
yellowstone-grpc-client = { git = "https://github.com/rpcpool/yellowstone-grpc", rev = "2531a8798164d5dd56e9c85664d08056ef7bf645" }
yellowstone-grpc-proto = { git = "https://github.com/rpcpool/yellowstone-grpc", rev = "2531a8798164d5dd56e9c85664d08056ef7bf645" }

[dev-dependencies]
# Depending on it is what builds the SBF binaries these tests load.
relay-test-fixtures = { path = "../test-fixtures" }
sha2 = "0.10"
solana-system-interface = { version = "3", features = ["bincode"] }
