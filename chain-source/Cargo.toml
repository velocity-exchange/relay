[package]
name = "relay-chain-source"
description = "Pluggable Solana chain access: subscription-fed account cache and in-process lazy-fork simulation behind one trait"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bincode = "1"
futures-util = "0.3"
# The simulation engine, not just a test harness: callers simulate in-process
# instead of paying an RPC round trip per decision.
litesvm = "0.16.0"
prometheus = { version = "0.13", default-features = false }
solana-account = "4"
solana-account-decoder = "4"
solana-client = "4"
solana-transaction-status-client-types = "4"
solana-commitment-config = "3"
solana-pubsub-client = "4"
solana-rpc-client-api = "4"
solana-sdk = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
# Same git rev as velocity's rust workspace so the two dependency trees can
# coexist in one deployment.
yellowstone-grpc-client = { git = "https://github.com/rpcpool/yellowstone-grpc", rev = "2531a8798164d5dd56e9c85664d08056ef7bf645" }
yellowstone-grpc-proto = { git = "https://github.com/rpcpool/yellowstone-grpc", rev = "2531a8798164d5dd56e9c85664d08056ef7bf645" }

[dev-dependencies]
# Depending on it is what builds the SBF binaries these tests load.
relay-test-fixtures = { path = "../test-fixtures" }
solana-sdk = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
