[package]
name = "relay-chain-source"
description = "Pluggable Solana chain access: subscription-fed account cache and in-process lazy-fork simulation behind one trait"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bincode = "1"
futures-util = "0.3"
# The simulation engine, not just a test harness: callers simulate in-process
# instead of paying an RPC round trip per decision.
litesvm = "0.11.0"
prometheus = { version = "0.13", default-features = false }
solana-account = "3"
solana-account-decoder = "3"
solana-client = "3"
solana-transaction-status-client-types = "3"
solana-commitment-config = "3"
solana-pubsub-client = "3"
solana-rpc-client-api = "3"
solana-sdk = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
# Same git rev as velocity's rust workspace so the two dependency trees can
# coexist in one deployment.
yellowstone-grpc-client = { git = "https://github.com/rpcpool/yellowstone-grpc", rev = "b39a415a219e842143f97440a0d0ef04207152c2" }
yellowstone-grpc-proto = { git = "https://github.com/rpcpool/yellowstone-grpc", rev = "b39a415a219e842143f97440a0d0ef04207152c2" }

[dev-dependencies]
solana-sdk = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
