name: Release Program to Mainnet

# Mainnet upgrades are gated by a `program-relay-<version>` tag (e.g.
# program-relay-v0.1.0). The workflow only PROPOSES the Squads transaction;
# multisig signers must approve + execute via the Squads UI.

on:
  push:
    tags:
      - "program-relay-*"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: stable
  SOLANA_VERSION: 2.3.11
  NODE_VERSION: "24.x.x"
  RELAY_MAINNET_PROGRAM_ID: 4D5tPhw9sqkdkR5CpmP427TH6y9p9AMuKUukUEHn3Mpu

jobs:
  release:
    name: Build + propose mainnet upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build relay
        uses: ./.github/actions/build-relay/

      - name: Buffer deploy (mainnet)
        id: buffer-deploy
        uses: ./.github/actions/buffer-deploy/
        with:
          program-id: ${{ env.RELAY_MAINNET_PROGRAM_ID }}
          rpc-url: ${{ secrets.MAINNET_RPC_ENDPOINT }}
          keypair: ${{ secrets.MAINNET_DEPLOYER_KEYPAIR }}
          buffer-authority: ${{ secrets.MAINNET_MULTISIG_VAULT }}

      - name: Propose Squads upgrade
        uses: solana-foundation/squads-program-action@839c079c881344c2da0365ad6a6bb07892e08e2f # v0.4.3
        with:
          rpc: ${{ secrets.MAINNET_RPC_ENDPOINT }}
          program: ${{ env.RELAY_MAINNET_PROGRAM_ID }}
          multisig: ${{ secrets.MAINNET_MULTISIG }}
          vault-index: "0"
          buffer: ${{ steps.buffer-deploy.outputs.buffer }}
          keypair: ${{ secrets.MAINNET_DEPLOYER_KEYPAIR }}
